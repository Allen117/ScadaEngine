     自洽：今日長條逐時（00~15 時）加總 = 圓餅五棟加總 = 10,691.0 kWh；YoY 子項差異加總 = 總表差異。 -->

    <script>
    // ── 模擬時鐘：固定 2026-09-09 15:42:10 ─────────────────────
    (function () {
        var RealDate = Date;
        var target = new RealDate(2026, 8, 9, 15, 42, 10).getTime();
        var offset = target - RealDate.now();
        function MockDate() {
            if (arguments.length === 0) return new RealDate(RealDate.now() + offset);
            return new (Function.prototype.bind.apply(RealDate, [null].concat([].slice.call(arguments))))();
        }
        MockDate.prototype = RealDate.prototype;
        MockDate.now = function () { return RealDate.now() + offset; };
        MockDate.parse = RealDate.parse;
        MockDate.UTC = RealDate.UTC;
        window.Date = MockDate;
    })();

    // ── 模擬 API：攔截 fetch，餵前端與正式後端相同格式的假資料 ──
    (function () {
        var NOW_MIN = 15 * 60 + 42; // 15:42

        function pad2(n) { return n < 10 ? '0' + n : String(n); }

        // 今日需量曲線（每分鐘一點）：辦公型單峰，24Hr 大樓提供夜間基載 ~370 kW，
        // 上午 11:00 尖峰 995.0 kW，目前 812.4 kW
        function buildTrend() {
            var ctrl = [
                [0, 372], [120, 352], [300, 366], [390, 470], [420, 560],
                [480, 724], [540, 858], [600, 930], [640, 975], [660, 995],
                [690, 940], [720, 902], [730, 845], [780, 952], [810, 934],
                [900, 880], [930, 835], [942, 812.4]
            ];
            var pts = [];
            for (var m = 0; m <= NOW_MIN; m++) {
                var i = 0;
                while (i < ctrl.length - 1 && ctrl[i + 1][0] < m) i++;
                var a = ctrl[i], b = ctrl[Math.min(i + 1, ctrl.length - 1)];
                var v = (b[0] === a[0]) ? a[1]
                    : a[1] + (b[1] - a[1]) * (m - a[0]) / (b[0] - a[0]);
                v += Math.sin(m * 0.73) * 3.5 + Math.sin(m * 0.171) * 2.2; // 自然抖動
                if (m !== 660) v = Math.min(v, 993.5);
                if (m === 660) v = 995.0;
                if (m === NOW_MIN) v = 812.4;
                pts.push({ t: pad2(Math.floor(m / 60)) + ':' + pad2(m % 60), v: Math.round(v * 10) / 10, q: 1 });
            }
            return pts;
        }

        // 今日逐時 kWh：00~15 時已完成（16 時之後為未來 → 0）。
        // 加總 = 10,691（= 圓餅五棟加總 = YoY 本期總表）
        var HOUR_LABELS = [], HOUR_VALUES = [
            372, 360, 352, 356, 366, 402, 470, 612,
            790, 930, 980, 995, 902, 918, 952, 934,
            0, 0, 0, 0, 0, 0, 0, 0
        ];
        for (var h = 0; h < 24; h++) HOUR_LABELS.push(pad2(h) + ':00');

        var MOCK = {
            '/EMS/api/main-meter-info': function () {
                return {
                    hasMainMeter: true,
                    mode: 'aggregated',
                    name: '台電總表',
                    voltage: { unit: 'kV' },
                    current: { unit: 'A' },
                    power: { unit: 'kW' },
                    powerFactor: { unit: '' }
                };
            },
            '/EMS/api/main-meter-values': function () {
                // 11.4 kV、812.4 kW、PF 0.96 → I = P / (√3·V·PF) ≈ 42.86 A
                return { voltage: 11.4, current: 42.86, power: 812.4, powerFactor: 0.96 };
            },
            '/EMS/api/demand-circuits': function () {
                return [
                    { id: 1, name: '台電總表' },
                    { id: 2, name: '運航大樓' },
                    { id: 3, name: '第二訓練大樓-24Hr' },
                    { id: 4, name: '第一訓練大樓' },
                    { id: 5, name: '備勤大樓' },
                    { id: 6, name: '第二訓練大樓-一般' }
                ];
            },
            '/EMS/api/main-meter': function () {
                return { hasMainMeter: true, id: 1, name: '台電總表', hasChildren: true };
            },
            '/EMS/api/demand-today': function () {
                return { hasData: true, currentKW: 812.4, maxKW: 995.0, maxAt: '11:00', quality: 1 };
            },
            '/EMS/api/demand-trend': buildTrend,
            '/EMS/api/circuit-energy': function () {
                return { labels: HOUR_LABELS, values: HOUR_VALUES };
            },
            '/EMS/api/main-meter-breakdown': function () {
                return {
                    hasMainMeter: true,
                    meterName: '台電總表',
                    items: [
                        { id: 2, name: '運航大樓',            kwh: 3462.8 },
                        { id: 3, name: '第二訓練大樓-24Hr',   kwh: 2683.5 },
                        { id: 4, name: '第一訓練大樓',        kwh: 1764.0 },
                        { id: 5, name: '備勤大樓',            kwh: 1560.9 },
                        { id: 6, name: '第二訓練大樓-一般',   kwh: 1219.8 }
                    ]
                };
            },
            '/EMS/api/main-meter-yoy': function () {
                return {
                    hasMainMeter: true,
                    rows: [
                        { id: 1, name: '台電總表',            isMainMeter: true,  currentKwh: 10691.0, lastYearKwh: 10812.6, diffKwh: -121.6, pctChange: -1.1 },
                        { id: 2, name: '運航大樓',            isMainMeter: false, currentKwh: 3462.8,  lastYearKwh: 3402.5,  diffKwh: 60.3,   pctChange: 1.8 },
                        { id: 3, name: '第二訓練大樓-24Hr',   isMainMeter: false, currentKwh: 2683.5,  lastYearKwh: 2758.9,  diffKwh: -75.4,  pctChange: -2.7 },
                        { id: 4, name: '第一訓練大樓',        isMainMeter: false, currentKwh: 1764.0,  lastYearKwh: 1839.6,  diffKwh: -75.6,  pctChange: -4.1 },
                        { id: 5, name: '備勤大樓',            isMainMeter: false, currentKwh: 1560.9,  lastYearKwh: 1523.4,  diffKwh: 37.5,   pctChange: 2.5 },
                        { id: 6, name: '第二訓練大樓-一般',   isMainMeter: false, currentKwh: 1219.8,  lastYearKwh: 1288.2,  diffKwh: -68.4,  pctChange: -5.3 }
                    ]
                };
            }
        };

        var realFetch = window.fetch;
        window.fetch = function (url, opts) {
            var path = String(url).split('?')[0];
            if (MOCK[path]) {
                return Promise.resolve(new Response(JSON.stringify(MOCK[path]()), {
                    status: 200,
                    headers: { 'Content-Type': 'application/json' }
                }));
            }
            return realFetch.apply(this, arguments);
        };
    })();
    </script>

    <script>
        (function () {
            function updateClock() {
                var now = new Date();
                var pad = function (n) { return n.toString().padStart(2, '0'); };
                var s = now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate()) +
                    ' ' + pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());
                var el = document.getElementById('serverClock');
                if (el) el.textContent = s;
            }
            updateClock();
            setInterval(updateClock, 1000);
        })();
    </script>
