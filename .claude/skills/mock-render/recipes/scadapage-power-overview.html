<!DOCTYPE html>
<!-- ScadaPage 即時監控（SCADA 深藍）＋「電力迴路總攬」圖面 mock recipe
     圖面 = SVG 單線圖背景（data URL）+ 真實 widget（realtimeValue kW / cmetric day_kwh）疊數值
     MOCK 對照：
       /Designer/Load                → 頁面樹 + 本圖面 widget state（背景 SVG 於此組出）
       /api/realtime/latest          → 4 個 kW 即時值（sid → value）
       /api/scadapage/circuit-metric → 4 個迴路本日用電 day_kwh
       /Realtime/ActiveAlarms        → 空警報（面板自動收合貼底）
       /api/alarm-rules /api/control/manual-values /api/schedules → 空
     自洽驗算：kW 312.40+286.90+78.20=677.50；kWh 4215.8+3876.2+1024.6=9116.6 -->
<html lang="zh-TW">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>即時監控 - SCADA 監控系統</title>

    <link href="{{WWWROOT}}/lib/bootstrap/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{WWWROOT}}/lib/font-awesome/css/all.min.css">
    <link rel="stylesheet" href="{{WWWROOT}}/css/navbar-submenu.css">
    <link rel="stylesheet" href="{{WWWROOT}}/css/scadapage.css">
    <link rel="stylesheet" href="{{WWWROOT}}/css/active-alarm-panel.css">

    <!-- 與 _Layout.cshtml 同步的自訂樣式 -->
    <style>
        html, body { overflow-x: hidden; }
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
        }
        .navbar { box-shadow: 0 2px 4px rgba(0,0,0,.1); }
        .navbar .nav-link { white-space: nowrap; }
        .navbar-collapse { flex-wrap: nowrap; }
        .footer {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 8px 0;
            margin-top: auto;
        }
        main { min-height: calc(100vh - 140px); }
        .card {
            border: none;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
        }
        .btn-primary { background: linear-gradient(45deg, #007bff, #0056b3); border: none; }
        .text-primary { color: #007bff !important; }
        /* 截圖穩定性：headless 下 document.timeline 凍結於 0，CSS transition 永遠停在起始值
           （警報面板 collapse 的 max-height 280→0 收不起來），全域關閉 transition/animation */
        *, *::before, *::after { transition: none !important; animation: none !important; }
    </style>

    <script>
    // ── 模擬時鐘：固定頁面時間（要換日期/時刻改這一行） ─────────
    (function () {
        var RealDate = Date;
        var target = new RealDate(2026, 8, 9, 15, 42, 10).getTime();
        var offset = target - RealDate.now();
        function MockDate() {
            if (arguments.length === 0) return new RealDate(RealDate.now() + offset);
            return new (Function.prototype.bind.apply(RealDate, [null].concat([].slice.call(arguments))))();
        }
        MockDate.prototype = RealDate.prototype;
        MockDate.now = function () { return RealDate.now() + offset; };
        MockDate.parse = RealDate.parse;
        MockDate.UTC = RealDate.UTC;
        window.Date = MockDate;
    })();

    // ── 模擬 API：攔截 fetch，key = 去掉 query string 的路徑 ──────
    (function () {

        // ═══ 電力迴路總攬：SVG 單線圖背景（1200x630，與畫布同尺寸） ═══
        function buildPowerOverviewSvg() {
            function card(x, y, w, h, headerColor, title) {
                return '<g filter="url(#cardShadow)">' +
                    '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="10" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"/>' +
                    '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="42" rx="10" fill="' + headerColor + '"/>' +
                    '<rect x="' + x + '" y="' + (y + 22) + '" width="' + w + '" height="20" fill="' + headerColor + '"/>' +
                    '<text x="' + (x + w / 2) + '" y="' + (y + 27) + '" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">' + title + '</text>' +
                    '<line x1="' + (x + w / 2) + '" y1="' + (y + 55) + '" x2="' + (x + w / 2) + '" y2="' + (h + y - 15) + '" stroke="#e9ecef" stroke-width="1.5"/>' +
                    '<text x="' + (x + w * 0.25) + '" y="' + (y + 68) + '" text-anchor="middle" font-size="13" fill="#8a97a5">即時功率</text>' +
                    '<text x="' + (x + w * 0.75) + '" y="' + (y + 68) + '" text-anchor="middle" font-size="13" fill="#8a97a5">本日用電</text>' +
                    '</g>';
            }
            var svg =
                '<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Segoe UI, Microsoft JhengHei, sans-serif">' +
                '<defs><filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">' +
                '<feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="rgba(0,0,0,0.12)"/></filter></defs>' +
                '<rect width="1200" height="630" fill="#ffffff"/>' +
                '<text x="600" y="52" text-anchor="middle" font-size="30" font-weight="700" fill="#1a3a5c">電力迴路總攬</text>' +
                '<rect x="560" y="64" width="80" height="4" rx="2" fill="#0d6efd"/>' +
                // 連接線：父迴路 → 匯流排 → 三個子迴路
                '<line x1="600" y1="260" x2="600" y2="315" stroke="#6c757d" stroke-width="3"/>' +
                '<line x1="250" y1="315" x2="950" y2="315" stroke="#6c757d" stroke-width="5" stroke-linecap="round"/>' +
                '<line x1="250" y1="315" x2="250" y2="360" stroke="#6c757d" stroke-width="3"/>' +
                '<line x1="600" y1="315" x2="600" y2="360" stroke="#6c757d" stroke-width="3"/>' +
                '<line x1="950" y1="315" x2="950" y2="360" stroke="#6c757d" stroke-width="3"/>' +
                '<circle cx="250" cy="315" r="5" fill="#6c757d"/>' +
                '<circle cx="600" cy="315" r="5" fill="#6c757d"/>' +
                '<circle cx="950" cy="315" r="5" fill="#6c757d"/>' +
                // 父迴路卡（台電電表）
                card(450, 90, 300, 170, '#1a3a5c', '⚡ 台電電表') +
                // 子迴路卡 x3
                card(100, 360, 300, 170, '#2e75b6', '生產大樓A') +
                card(450, 360, 300, 170, '#2e75b6', '生產大樓B') +
                card(800, 360, 300, 170, '#2e75b6', '辦公大樓') +
                // 註腳
                '<text x="600" y="595" text-anchor="middle" font-size="12" fill="#adb5bd">資料時間 2026-09-09 15:42｜本日用電自 00:00 累計</text>' +
                '</svg>';
            // renderScadaCanvas 以不帶引號的 url(...) 塞進 CSS，
            // encodeURIComponent 不編碼 ( ) '，須補編碼否則 rgba(...)/url(#id) 的括號會截斷 CSS
            return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg)
                .replace(/\(/g, '%28').replace(/\)/g, '%29').replace(/'/g, '%27');
        }

        // ═══ 電力迴路總攬：widget state（疊在 SVG 卡片數值區上）═══
        // 卡片內部：左半 = kW 即時值（realtimeValue+SID），右半 = 本日用電（cmetric day_kwh）
        function powerOverviewWidgets() {
            function kwWidget(x, y, sid, name, fs, clr) {
                return { szType: 'realtimeValue', nX: x, nY: y, nW: 140, nH: 60,
                         props: { szSid: sid, szUnit: 'kW', szTitle: name + ' 即時功率',
                                  nFontSize: fs, szFontColor: clr, szBgColor: 'transparent' } };
            }
            function kwhWidget(x, y, cid, name, fs) {
                return { szType: 'realtimeValue', nX: x, nY: y, nW: 140, nH: 60,
                         props: { nCircuitId: cid, szMetric: 'day_kwh', szCircuitName: name,
                                  nAccDecimals: 1, nFontSize: fs, szFontColor: '#212529', szBgColor: 'transparent' } };
            }
            return [
                // 台電電表（父迴路）
                kwWidget(455, 168, 'MB001-AI-001', '台電電表', 26, '#0d6efd'),
                kwhWidget(605, 168, 1, '台電電表', 26),
                // 生產大樓A
                kwWidget(105, 438, 'MB002-AI-001', '生產大樓A', 24, '#0d6efd'),
                kwhWidget(255, 438, 2, '生產大樓A', 24),
                // 生產大樓B
                kwWidget(455, 438, 'MB003-AI-001', '生產大樓B', 24, '#0d6efd'),
                kwhWidget(605, 438, 3, '生產大樓B', 24),
                // 辦公大樓
                kwWidget(805, 438, 'MB004-AI-001', '辦公大樓', 24, '#0d6efd'),
                kwhWidget(955, 438, 4, '辦公大樓', 24)
            ];
        }

        var MOCK = {
            '/Designer/Load': function () {
                return {
                    hasData: true,
                    pages: [
                        { szPageSid: 'PG-POWER-OVERVIEW', szPageName: '電力迴路總攬', szPageIcon: 'fa-bolt',
                          szParentPageSid: null, nSortOrder: 1, nCanvasW: 1200, nCanvasH: 630,
                          szBgDataUrl: buildPowerOverviewSvg(), szBgFileName: 'power-overview.svg',
                          szWidgetStateJson: JSON.stringify(powerOverviewWidgets()) },
                        { szPageSid: 'PG-HVAC', szPageName: '空調系統', szPageIcon: 'fa-snowflake',
                          szParentPageSid: null, nSortOrder: 2, nCanvasW: 1200, nCanvasH: 800,
                          szBgDataUrl: null, szWidgetStateJson: '[]' },
                        { szPageSid: 'PG-WATER', szPageName: '給排水系統', szPageIcon: 'fa-tint',
                          szParentPageSid: null, nSortOrder: 3, nCanvasW: 1200, nCanvasH: 800,
                          szBgDataUrl: null, szWidgetStateJson: '[]' }
                    ]
                };
            },
            // 即時 kW：子迴路加總 = 台電電表（312.40+286.90+78.20 = 677.50）
            '/api/realtime/latest': function () {
                return { success: true, data: [
                    { sid: 'MB001-AI-001', name: '台電電表有效功率',  value: '677.50', quality: 'GOOD' },
                    { sid: 'MB002-AI-001', name: '生產大樓A有效功率', value: '312.40', quality: 'GOOD' },
                    { sid: 'MB003-AI-001', name: '生產大樓B有效功率', value: '286.90', quality: 'GOOD' },
                    { sid: 'MB004-AI-001', name: '辦公大樓有效功率',  value: '78.20',  quality: 'GOOD' }
                ] };
            },
            // 本日用電 day_kwh：4215.8+3876.2+1024.6 = 9116.6
            '/api/scadapage/circuit-metric': function () {
                return { success: true, results: [
                    { nCircuitId: 1, szMetric: 'day_kwh', dValue: 9116.6, szStatus: 'ok', isEstimated: false },
                    { nCircuitId: 2, szMetric: 'day_kwh', dValue: 4215.8, szStatus: 'ok', isEstimated: false },
                    { nCircuitId: 3, szMetric: 'day_kwh', dValue: 3876.2, szStatus: 'ok', isEstimated: false },
                    { nCircuitId: 4, szMetric: 'day_kwh', dValue: 1024.6, szStatus: 'ok', isEstimated: false }
                ] };
            },
            '/Realtime/ActiveAlarms': function () { return { success: true, isConnected: true, data: [] }; },
            '/api/alarm-rules': function () { return []; },
            '/api/control/manual-values': function () { return {}; },
            '/api/schedules': function () { return []; }
        };
        var realFetch = window.fetch;
        window.fetch = function (url, opts) {
            var path = String(url).split('?')[0];
            if (MOCK[path]) {
                return Promise.resolve(new Response(JSON.stringify(MOCK[path]()), {
                    status: 200,
                    headers: { 'Content-Type': 'application/json' }
                }));
            }
            return realFetch.apply(this, arguments);
        };
    })();
    </script>
</head>
<body class="d-flex flex-column">

    <!-- 主要內容 -->
    <main role="main" class="flex-grow-1">
        <!-- ═══════════ PAGE_CONTENT：Features/ScadaPage/Views/Index.cshtml（Localizer 已代入 zh-TW） ═══════════ -->
        <div class="container-fluid mt-4">

            <!-- 主體：頁面樹側欄 + 畫布區 -->
            <div class="d-flex gap-3">

                <!-- 頁面樹側欄 -->

                        <div class="scada-tree-panel-title">

                        </div>

            </div>

            <!-- 未恢復警報面板 -->
            <div id="activeAlarmPanel" class="active-alarm-panel">
